name: Update cask
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-cask
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s script -p 'test_*.py'
      - run: python3 script/update.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit release update
        run: |
          if git diff --quiet -- Casks/goop.rb; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/goop.rb
          git commit -m 'Update Goop release'
          git push
